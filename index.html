<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Porsche Sales</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }
        .header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; letter-spacing: 2px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .filters {
            background: white;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        .filter-group { display: flex; flex-direction: column; }
        .filter-group label { font-weight: 600; margin-bottom: 5px; font-size: 0.9em; }
        .filter-group select {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-reset {
            padding: 10px 20px;
            background-color: #666;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            align-self: flex-end;
        }
        .btn-reset:hover { background-color: #333; }
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .metric-card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid #1a1a1a;
        }
        .metric-card h3 { font-size: 0.85em; color: #666; margin-bottom: 15px; }
        .metric-card .value { font-size: 2em; color: #1a1a1a; }
        .charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 8px;
        }
        .chart-container h2 { font-size: 1.1em; margin-bottom: 20px; }
        .chart-wrapper { position: relative; height: 300px; }
        .empty-message { background: white; padding: 50px; text-align: center; border-radius: 8px; color: #999; }
        @media (max-width: 768px) {
            .charts { grid-template-columns: 1fr; }
        }
    </style>
</head>

    <div class="header">

    </div>
    <div class="container">
        <div class="filters">

                </select>
            </div>
            <div class="filter-group">
                <label for="filterModel">Modelo</label>
                <select id="filterModel" onchange="updateDashboard()">
                    <option value="">Todos</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterYear">Ano</label>
                <select id="filterYear" onchange="updateDashboard()">
                    <option value="">Todos</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterPayment">Metodo de Pagamento</label>
                <select id="filterPayment" onchange="updateDashboard()">
                    <option value="">Todos</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterStatus">Status de Entrega</label>
                <select id="filterStatus" onchange="updateDashboard()">
                    <option value="">Todos</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterPrice">Faixa de Preco</label>
                <select id="filterPrice" onchange="updateDashboard()">
                    <option value="">Todos</option>
                    <option value="0-50000">Ate 50 mil</option>
                    <option value="50000-100000">50 - 100 mil</option>
                    <option value="100000-150000">100 - 150 mil</option>
                    <option value="150000-999999">Acima de 150 mil</option>
                </select>
            </div>
            <button class="btn-reset" onclick="resetFilters()">Limpar Filtros</button>
        </div>
        <div class="metrics">
            <div class="metric-card">
                <h3>Total de Vendas</h3>
                <div class="value" id="metricSales">0</div>
            </div>
            <div class="metric-card">
                <h3>Receita Total</h3>
                <div class="value" id="metricRevenue">USD 0</div>
            </div>
            <div class="metric-card">

                <div class="value" id="metricAverage">USD 0</div>
            </div>
            <div class="metric-card">
                <h3>Taxa de Entrega</h3>

            </div>
        </div>
        <div class="charts" id="chartsContainer">

                </div>
            </div>
        </div>
        <div id="emptyMessage" class="empty-message" style="display: none;">
            Nenhum resultado encontrado com os filtros selecionados.
        </div>
    </div>

        // Funcao para popular dropdowns
        function populateFilters() {
            const states = [...new Set(salesData.map(d => d.state))].sort();
            const models = [...new Set(salesData.map(d => d.model))].sort();
            const years = [...new Set(salesData.map(d => d.year))].sort().reverse();
            const payments = [...new Set(salesData.map(d => d.payment_method))].sort();
            const statuses = [...new Set(salesData.map(d => d.delivery_status))].sort();
            
            const stateSelect = document.getElementById('filterState');
            states.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.text = s;
                stateSelect.appendChild(opt);
            });
            
            const modelSelect = document.getElementById('filterModel');
            models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.text = m;
                modelSelect.appendChild(opt);
            });
            
            const yearSelect = document.getElementById('filterYear');
            years.forEach(y => {
                const opt = document.createElement('option');
                opt.value = y;
                opt.text = y;
                yearSelect.appendChild(opt);
            });
            
            const paymentSelect = document.getElementById('filterPayment');
            payments.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                opt.text = p;
                paymentSelect.appendChild(opt);
            });
            
            const statusSelect = document.getElementById('filterStatus');
            statuses.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.text = s;
                statusSelect.appendChild(opt);
            });
        }
        
        // Funcao para filtrar dados
        function getFilteredData() {
            const state = document.getElementById('filterState').value;
            const model = document.getElementById('filterModel').value;
            const year = document.getElementById('filterYear').value;
            const payment = document.getElementById('filterPayment').value;
            const status = document.getElementById('filterStatus').value;
            const price = document.getElementById('filterPrice').value;
            
            return salesData.filter(d => {
                const stateMatch = !state || d.state === state;
                const modelMatch = !model || d.model === model;
                const yearMatch = !year || d.year == year;
                const paymentMatch = !payment || d.payment_method === payment;
                const statusMatch = !status || d.delivery_status === status;
                
                let priceMatch = true;
                if (price) {
                    const [min, max] = price.split('-').map(Number);
                    priceMatch = d.price >= min && d.price <= max;
                }
                
                return stateMatch && modelMatch && yearMatch && paymentMatch && statusMatch && priceMatch;
            });
        }
        
        // Funcao para atualizar metricas
        function updateMetrics() {
            const data = getFilteredData();
            const totalSales = data.length;
            const totalRevenue = data.reduce((sum, d) => sum + d.price, 0);
            const avgTicket = totalSales > 0 ? totalRevenue / totalSales : 0;
            const delivered = data.filter(d => d.delivery_status === 'Delivered').length;
            const deliveryRate = totalSales > 0 ? Math.round(delivered / totalSales * 100) : 0;
            
            document.getElementById('metricSales').textContent = totalSales;
            document.getElementById('metricRevenue').textContent = 'USD ' + (Math.round(totalRevenue / 1000) * 1000).toLocaleString();
            document.getElementById('metricAverage').textContent = 'USD ' + Math.round(avgTicket).toLocaleString();
            document.getElementById('metricDelivery').textContent = deliveryRate + '%';
        }
        
        // Funcao para atualizar grafico de receita por estado
        function updateRevenueChart() {
            const data = getFilteredData();
            const revenueByState = {};
            
            data.forEach(d => {
                if (!revenueByState[d.state]) {
                    revenueByState[d.state] = 0;
                }
                revenueByState[d.state] += d.price;
            });
            
            const sorted = Object.entries(revenueByState)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);
            
            const labels = sorted.map(e => e[0]);
            const values = sorted.map(e => e[1]);
            
            const ctx = document.getElementById('chartRevenue').getContext('2d');
            if (chartRevenue) chartRevenue.destroy();
            
            chartRevenue = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Receita USD',
                        data: values,
                        backgroundColor: '#1a1a1a',
                        borderColor: '#333',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y',
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { callback: function(value) { return 'USD ' + (value/1000).toFixed(0) + 'k'; } } }
                    }
                }
            });
        }
        
        // Funcao para atualizar grafico de modelos
        function updateModelsChart() {
            const data = getFilteredData();
            const modelCount = {};
            
            data.forEach(d => {
                modelCount[d.model] = (modelCount[d.model] || 0) + 1;
            });
            
            const labels = Object.keys(modelCount);
            const values = Object.values(modelCount);
            const colors = ['#1a1a1a', '#333', '#555', '#777', '#999', '#bbb'];
            
            const ctx = document.getElementById('chartModels').getContext('2d');
            if (chartModels) chartModels.destroy();
            
            chartModels = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: colors.slice(0, labels.length),
                        borderColor: '#fff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }
        
        // Funcao para atualizar grafico de status de entrega
        function updateDeliveryChart() {
            const data = getFilteredData();
            const statusCount = {};
            
            data.forEach(d => {
                statusCount[d.delivery_status] = (statusCount[d.delivery_status] || 0) + 1;
            });
            
            const labels = Object.keys(statusCount);
            const values = Object.values(statusCount);
            const colors = ['#2d5016', '#4a7c2c', '#6b9f3d', '#8bb855', '#a8d26e', '#c5e599', '#ddedbc', '#e8f4d9', '#f0f8e8', '#f5fbf0'];
            
            const ctx = document.getElementById('chartDelivery').getContext('2d');
            if (chartDelivery) chartDelivery.destroy();
            
            chartDelivery = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Quantidade',
                        data: values,
                        backgroundColor: colors.slice(0, labels.length),
                        borderColor: '#fff',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });
        }
        
        // Funcao para atualizar dashboard
        function updateDashboard() {
            const data = getFilteredData();
            
            if (data.length === 0) {
                document.getElementById('chartsContainer').style.display = 'none';
                document.getElementById('emptyMessage').style.display = 'block';
            } else {
                document.getElementById('chartsContainer').style.display = 'grid';
                document.getElementById('emptyMessage').style.display = 'none';
                updateMetrics();
                updateRevenueChart();
                updateModelsChart();
                updateDeliveryChart();
            }
        }
        
        // Funcao para resetar filtros
        function resetFilters() {
            document.getElementById('filterState').value = '';
            document.getElementById('filterModel').value = '';
            document.getElementById('filterYear').value = '';
            document.getElementById('filterPayment').value = '';
            document.getElementById('filterStatus').value = '';
            document.getElementById('filterPrice').value = '';
            updateDashboard();
        }
        
        // Inicializar
        window.addEventListener('load', () => {
            populateFilters();
            updateDashboard();
        });
    </script>
</body>
</html>
